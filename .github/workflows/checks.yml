name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: |
          python -m py_compile Smart_Garbage_Neighbourhood_Routing.py
          python -m py_compile experiments/fixed-vs-adaptive/analyze.py

      - name: Parse simulation configuration
        run: |
          python -c "import xml.etree.ElementTree as ET; ET.parse('neighbourhood-demo.csc'); print('Simulation XML parsed successfully')"

      - name: Reproduce recorded results
        run: |
          python experiments/fixed-vs-adaptive/analyze.py > /tmp/results.md
          diff -u experiments/fixed-vs-adaptive/RESULTS.md /tmp/results.md
